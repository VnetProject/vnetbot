<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>چیدمان منو</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f3f6);
    --text: var(--tg-theme-text-color, #111827);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --accent: var(--tg-theme-button-color, #2563eb);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--text) 14%, transparent);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg2); color: var(--text); font-family: system-ui, Tahoma, sans-serif; padding: 14px 16px 150px; }
  h1 { font-size: 18px; margin: 4px 0 6px; }
  .hint { color: var(--hint); font-size: 13px; line-height: 1.7; margin: 0 0 14px; }
  .row { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .row-title { font-size: 12px; color: var(--hint); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .cells { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { flex: 1 1 0; min-width: 90px; padding: 11px 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg2);
          font-size: 14px; text-align: center; cursor: pointer; user-select: none; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  .chip.primary { border-right: 5px solid #3b82f6; }
  .chip.success { border-right: 5px solid #22c55e; }
  .chip.danger { border-right: 5px solid #ef4444; }
  .chip.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--bg)); font-weight: 700; }
  .chip.drop { flex: 0 0 auto; min-width: 0; border-style: dashed; color: var(--hint); background: transparent; padding: 11px 14px; }
  .chip.drop.active { border-color: var(--accent); color: var(--accent); }
  .section-title { font-size: 14px; font-weight: 700; margin: 18px 0 8px; }
  button { font: inherit; }
  .btn { border: 0; border-radius: 10px; padding: 11px 14px; background: var(--bg); color: var(--text); border: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .btn.danger { color: #dc2626; }
  .btn[disabled] { opacity: .4; }
  .bar { position: fixed; right: 0; left: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .bar .sel { font-size: 13px; color: var(--hint); margin-bottom: 8px; min-height: 18px; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tools .btn { flex: 1 1 auto; padding: 10px 8px; }
  .toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<h1>🧩 چیدمان دکمه‌های منوی اصلی</h1>
<p class="hint">روی یک دکمه بزن تا انتخاب بشه، بعد از نوار پایین جابه‌جاش کن یا روی «＋ اینجا» توی ردیف دلخواه بزن تا همون‌جا قرار بگیره. هر ردیف همون یک خط کیبورد مشتریه. آخر کار «ذخیره» رو بزن.</p>

<div id="rows"></div>
<button class="btn" id="addRow" style="width:100%">➕ ردیف جدید</button>

<div class="section-title">🚫 دکمه‌های مخفی (توی منوی مشتری نمایش داده نمی‌شن)</div>
<div class="row"><div class="cells" id="hidden"></div></div>

<div class="bar">
  <div class="sel" id="selText">یک دکمه رو انتخاب کن.</div>
  <div class="tools" id="tools">
    <button class="btn" data-act="right">➡️</button>
    <button class="btn" data-act="left">⬅️</button>
    <button class="btn" data-act="up">⬆️ ردیف بالا</button>
    <button class="btn" data-act="down">⬇️ ردیف پایین</button>
    <button class="btn" data-act="newrow">➕ ردیف جدا</button>
    <button class="btn" data-act="rename">✏️ نام</button>
    <button class="btn danger" data-act="hide">🚫 مخفی</button>
  </div>
  <button class="btn primary" id="save" style="width:100%;margin-top:8px">💾 ذخیره</button>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : '';

let rows = [];      // [[{key,label,style}, ...], ...]
let hidden = [];    // [{key,label,style}]
let labels = {};    // key -> edited label
let sel = null;     // selected key

const $ = (id) => document.getElementById(id);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

async function api(body) {
  const res = await fetch('../layout_api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData, ...body }) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function find(key) {
  for (let r = 0; r < rows.length; r++) {
    const c = rows[r].findIndex(b => b.key === key);
    if (c >= 0) return { where: 'row', r, c };
  }
  const h = hidden.findIndex(b => b.key === key);
  return h >= 0 ? { where: 'hidden', h } : null;
}
function take(key) {
  const f = find(key);
  if (!f) return null;
  const item = f.where === 'row' ? rows[f.r].splice(f.c, 1)[0] : hidden.splice(f.h, 1)[0];
  return { item, f };
}
function cleanup() { rows = rows.filter(r => r.length > 0); }

function chip(b) {
  const el = document.createElement('div');
  el.className = 'chip ' + (b.style || '') + (b.key === sel ? ' selected' : '');
  el.textContent = labels[b.key] ?? b.label;
  el.onclick = () => { sel = sel === b.key ? null : b.key; render(); };
  return el;
}

function render() {
  const box = $('rows'); box.innerHTML = '';
  rows.forEach((row, r) => {
    const card = document.createElement('div'); card.className = 'row';
    card.innerHTML = '<div class="row-title"><span>ردیف ' + (r + 1) + '</span></div>';
    const cells = document.createElement('div'); cells.className = 'cells';
    row.forEach(b => cells.appendChild(chip(b)));
    if (row.length < 8) cells.appendChild(dropChip(() => placeInRow(r)));
    card.appendChild(cells); box.appendChild(card);
  });
  const hid = $('hidden'); hid.innerHTML = '';
  hidden.forEach(b => hid.appendChild(chip(b)));
  if (!hidden.length) hid.innerHTML = '<span class="hint" style="margin:0">خالیه</span>';

  const f = sel ? find(sel) : null;
  const all = [...rows.flat(), ...hidden];
  const cur = sel ? all.find(b => b.key === sel) : null;
  $('selText').textContent = cur ? 'انتخاب‌شده: ' + (labels[cur.key] ?? cur.label) + (f.where === 'hidden' ? ' (مخفی — روی «＋ اینجا» بزن تا نمایش داده بشه)' : '') : 'یک دکمه رو انتخاب کن.';
  document.querySelectorAll('#tools .btn').forEach(b => b.disabled = !cur || (f.where === 'hidden' && b.dataset.act !== 'rename'));
  document.querySelectorAll('.chip.drop').forEach(d => d.classList.toggle('active', !!cur));
}

function dropChip(handler) {
  const el = document.createElement('div'); el.className = 'chip drop'; el.textContent = '＋ اینجا';
  el.onclick = () => { if (!sel) { toast('اول یک دکمه رو انتخاب کن'); return; } handler(); };
  return el;
}

function placeInRow(r) {
  const target = rows[r];          // keep the array itself: taking the item may delete an emptied row
  const t = take(sel); if (!t) return;
  target.push(t.item);
  cleanup(); render();
}

$('addRow').onclick = () => {
  if (!sel) { toast('اول یک دکمه رو انتخاب کن تا توی ردیف جدید قرار بگیره'); return; }
  const t = take(sel); if (!t) return;
  rows.push([t.item]); cleanup(); render();
};

$('tools').onclick = (e) => {
  const act = e.target.dataset.act; if (!act || !sel) return;
  const f = find(sel);
  if (act === 'rename') {
    const all = [...rows.flat(), ...hidden]; const cur = all.find(b => b.key === sel);
    const next = prompt('نام جدید دکمه:', labels[sel] ?? cur.label);
    if (next && next.trim()) { labels[sel] = next.trim(); render(); }
    return;
  }
  if (f.where !== 'row') return;
  const { r, c } = f;
  if (act === 'right' && c > 0) { [rows[r][c - 1], rows[r][c]] = [rows[r][c], rows[r][c - 1]]; }
  else if (act === 'left' && c < rows[r].length - 1) { [rows[r][c + 1], rows[r][c]] = [rows[r][c], rows[r][c + 1]]; }
  else if (act === 'up' && r > 0) { const it = rows[r].splice(c, 1)[0]; rows[r - 1].push(it); }
  else if (act === 'down') { const it = rows[r].splice(c, 1)[0]; if (r + 1 < rows.length) rows[r + 1].push(it); else rows.push([it]); }
  else if (act === 'newrow') { if (rows[r].length > 1) { const it = rows[r].splice(c, 1)[0]; rows.splice(r + 1, 0, [it]); } }
  else if (act === 'hide') { hidden.push(rows[r].splice(c, 1)[0]); sel = null; }
  cleanup(); render();
};

async function save() {
  try {
    $('save').disabled = true;
    const res = await api({ action: 'save', rows: rows.map(r => r.map(b => b.key)), labels });
    if (!res.ok) throw new Error(res.error);
    toast('✅ ذخیره شد');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch (err) { toast('❌ ذخیره نشد: ' + err.message); }
  $('save').disabled = false;
}
$('save').onclick = save;

(async () => {
  try {
    const res = await api({ action: 'get' });
    if (!res.ok) throw new Error(res.error);
    rows = res.rows; hidden = res.hidden; render();
  } catch (err) {
    $('rows').innerHTML = '<div class="row">❌ بارگذاری نشد (' + err.message + '). این صفحه فقط از داخل ربات و فقط برای ادمین کار می‌کنه.</div>';
  }
})();
</script>
</body>
</html>
